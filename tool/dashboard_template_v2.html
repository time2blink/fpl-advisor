<style>
/* ===== Дизайн 2 (светлый) — по макетам mockups/light-v3. Логика общая: dashboard_core.js ===== */
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#FAFAFC;color:#17181F;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:linear-gradient(180deg,#F3F1FD 0%,#FAFAFC 420px) no-repeat,#FAFAFC;padding-bottom:96px}
a{color:#6B5CE7;text-decoration:none}a:hover{color:#4F3FD1}
button{font:inherit}
/* масштаб 110% и рабочая область ровно 1400 px на экране (1400/1.1 CSS px) — на компьютере; на телефоне без увеличения */
@media (min-width:900px){html{zoom:1.1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.demo{background:#E8A23B;color:#fff;text-align:center;padding:6px;font-weight:600;font-size:12.5px}
/* навигация */
.nav{position:sticky;top:0;z-index:20;background:rgba(250,250,252,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav-in{max-width:calc(1400px / 1.1);margin:0 auto;padding:18px 32px;display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand i{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#8B7CF6,#6B5CE7);display:block}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:999px;white-space:nowrap;color:#7A7C8A;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:#17181F}
.tabs button.on{color:#17181F;font-weight:600;background:#FFFFFF;box-shadow:0 1px 2px rgba(23,24,31,.06)}
.dot5{width:5px;height:5px;border-radius:50%;background:#E8A23B}
.upd{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#7A7C8A}
.upd i{width:6px;height:6px;border-radius:50%;background:#2EB67D;animation:pulse 2s infinite}
/* страница */
.wrap{max-width:calc(1400px / 1.1);margin:0 auto;padding:40px 32px 0;display:flex;flex-direction:column;gap:48px}
.wrap.over{padding-top:48px;gap:56px}.wrap.squad{gap:28px}.wrap.scout{gap:36px}.wrap.players{gap:24px}
.ht{font-weight:600;font-size:clamp(36px,4.5vw,48px);line-height:1;letter-spacing:-.045em}.ht span{color:#A6A8B4;font-weight:500}
.hd{display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.facts{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:14px;color:#7A7C8A}.facts b{color:#17181F;font-weight:600}.facts .sp{width:1px;height:14px;background:#DDDCE6}
.desc{font-size:14px;color:#7A7C8A;line-height:1.6;max-width:760px;text-wrap:pretty}
.sec{display:flex;flex-direction:column;gap:20px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:0 4px}.sh .t{font-weight:600;font-size:20px;letter-spacing:-.025em}.sh .s{font-size:13px;color:#7A7C8A}
.card{background:#FFFFFF;border-radius:28px;box-shadow:0 1px 2px rgba(23,24,31,.04)}
.card.gl{box-shadow:0 1px 2px rgba(23,24,31,.04),0 24px 60px -40px rgba(107,92,231,.25)}
.card.pd{padding:28px 32px;display:flex;flex-direction:column;gap:24px}
.card.tb{padding:16px 24px;overflow-x:auto}
.card.r24{border-radius:24px}
.lbl{font-size:12px;color:#7A7C8A}
.ch{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 12px}.ch b{font-size:15px;font-weight:600;letter-spacing:-.01em}.ch span{font-size:12px;color:#A6A8B4}
.g{display:grid;gap:12px;align-items:center;padding:8px;border-radius:14px;border-top:1px solid #F4F4F8}
.g.th{font-size:12px;color:#A6A8B4;border:0;padding:8px 8px 12px}
.g.hv{cursor:pointer}.g.hv:hover{background:#FAFAFC}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
/* игрок: фото + эмблема клуба (как в дизайне 1), иконки */
.av{--s:44px;position:relative;display:inline-block;width:var(--s);height:var(--s);flex:none;vertical-align:middle}
.avp{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:linear-gradient(145deg,hsl(var(--h,220) 70% 92%),hsl(var(--h,220) 60% 80%));display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.avp img{position:absolute;left:50%;bottom:-6%;height:112%;transform:translateX(-50%);object-fit:cover}
.avp .shirt{position:absolute;left:50%;top:52%;width:78%;transform:translate(-50%,-50%);opacity:.95}
.avp b{position:relative;z-index:1;color:#fff;text-shadow:0 1px 3px rgba(30,30,80,.45);font-size:calc(var(--s)*.3);font-weight:700;letter-spacing:-.02em}
.avp.has b,.avp.has .shirt{display:none}
.avb{position:absolute;right:-5px;bottom:-4px;width:calc(var(--s)*.42);height:calc(var(--s)*.42);object-fit:contain;background:#fff;border-radius:50%;padding:2px;box-shadow:0 2px 6px rgba(30,40,80,.25)}
.avd{border:2px solid #fff}
.av[data-id]{cursor:pointer}
.ico{display:inline-flex;width:var(--s);height:var(--s);flex:none;vertical-align:middle;filter:drop-shadow(0 3px 6px rgba(40,50,100,.18))}.ico svg{display:block}
.brand-ic{width:28px;height:28px;border-radius:8px;display:block}
.ca{border-radius:50%;color:#FFFFFF;display:grid;place-items:center;font-weight:600;flex-shrink:0;overflow:hidden}
.ca[data-id]{cursor:pointer}
.who{display:flex;align-items:center;gap:10px;min-width:0}.who>div:last-child{min-width:0}
.nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.mut{font-weight:500;color:#7A7C8A}
.cl{font-size:11px;color:#A6A8B4}
.row6{display:flex;align-items:center;gap:6px;min-width:0}
.plk{cursor:pointer}.plk:hover{color:#6B5CE7}
.tag{font-size:10px;font-weight:600;border-radius:999px;padding:2px 7px;white-space:nowrap}
.pl{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;display:inline-block}
.t-me{background:#F6F4FF;color:#6B5CE7}.t-sc{background:#FDEBD3;color:#9A5B12}.t-bl{background:#FBDCDD;color:#B13036}.t-gr{background:#EEEEF3;color:#5C5E6B}.t-ok{background:#D7F3E4;color:#1D7A4F}.t-mu{background:#F1F1F6;color:#7A7C8A}
.fxr{display:flex;gap:3px}.fxr span{flex:1;min-width:0;text-align:center;font-size:9px;font-weight:600;padding:4px 0;border-radius:999px;white-space:nowrap;overflow:hidden}
.d1{background:#D7F3E4;color:#1D7A4F}.d2{background:#EEEEF3;color:#5C5E6B}.d3{background:#FDEBD3;color:#9A5B12}.d4{background:#FBDCDD;color:#B13036}.d0{background:#F1F1F6;color:#A6A8B4}
.b4{height:4px;border-radius:2px;background:#F1F1F6;overflow:hidden}.b4 i{display:block;height:100%;border-radius:2px;background:#6B5CE7}
.seg{display:flex;gap:4px;background:#EFEDF8;border-radius:999px;padding:4px}
.seg button{border:0;padding:8px 18px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;background:transparent;color:#7A7C8A;display:flex;align-items:center;gap:8px}
.seg button.on{background:#FFFFFF;color:#17181F;box-shadow:0 1px 2px rgba(23,24,31,.08)}
.seg.sm button{padding:7px 14px;font-size:13px}.seg.md button{padding:8px 16px}
.gdot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#8B7CF6,#6B5CE7)}
.sw2{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#4A4C5A;border:0;background:none;padding:0}
.sw2 span{width:34px;height:20px;border-radius:999px;background:#D9D9E3;position:relative;transition:background .15s}
.sw2 span i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:left .15s}
.sw2.on span{background:#6B5CE7}.sw2.on span i{left:16px}
.stat .k{font-size:12px;color:#7A7C8A}.stat .v{font-size:30px;font-weight:600;letter-spacing:-.035em;margin-top:6px}.stat .s{font-size:12px;color:#A6A8B4;margin-top:2px}
.tile{background:#FAFAFC;border-radius:12px;padding:8px 6px;text-align:center}.tile b{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em}.tile span{display:block;font-size:10px;color:#A6A8B4;margin-top:1px}.tile.ac{background:#F6F4FF}.tile.ac b{color:#6B5CE7}
.cap{width:18px;height:18px;border-radius:50%;background:#17181F;color:#FFFFFF;display:grid;place-items:center;font-size:10px;font-weight:700;flex-shrink:0}
.empty{padding:24px 8px 16px;text-align:center;font-size:13px;color:#A6A8B4}
.inp{border:0;outline:none;background:#FAFAFC;border-radius:12px;padding:12px 16px;font-size:14px;color:#17181F;font-family:inherit}
.btn{border:0;background:#6B5CE7;color:#FFFFFF;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}.btn:hover{background:#5B4CD9}
.btn.g{background:#F1F1F6;color:#17181F}.btn.g:hover{background:#EAE9F2}.btn.r{background:#FBDCDD;color:#B13036}.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.hov:hover{box-shadow:0 1px 2px rgba(23,24,31,.04),0 24px 48px -28px rgba(107,92,231,.35)}
/* состав: поле */
.pitch{border-radius:20px;background:repeating-linear-gradient(180deg,#EEF7F1 0 64px,#E7F3EB 64px 128px);padding:28px 18px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.pitch:before{content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;border:2px solid rgba(255,255,255,.7);border-radius:50%;transform:translate(-50%,-50%)}
.pitch:after{content:"";position:absolute;left:18px;right:18px;top:50%;height:2px;background:rgba(255,255,255,.7)}
.pline{display:flex;justify-content:center;gap:12px;flex-wrap:nowrap;position:relative;z-index:1}
.pcard{background:#FFFFFF;border-radius:18px;padding:12px 13px;flex:0 0 auto;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(23,24,31,.06),0 10px 30px -18px rgba(23,24,31,.25);transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(23,24,31,.06),0 18px 40px -20px rgba(107,92,231,.45)}
.pbadge{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;color:#FFFFFF;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 0 0 3px #FFFFFF}
.ndot{width:6px;height:6px;border-radius:50%;background:#6B5CE7;flex-shrink:0}
.fdots{display:flex;gap:3px;justify-content:center;width:100%}.fdots span{flex:1;max-width:22px;height:5px;border-radius:3px}
.bench{background:#FAFAFC;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;cursor:pointer;position:relative}.bench:hover{background:#F6F4FF}
/* drawer */
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(470px,calc(100% - 24px));background:#F6F6FA;border-radius:28px;box-shadow:0 30px 90px -20px rgba(23,24,31,.35);transform:translateX(115%);transition:transform .25s;z-index:40;padding:18px 18px 28px;overflow:auto;display:flex;flex-direction:column;gap:24px}
.drawer.open{transform:none}
.dhead{background:#FFFFFF;border-radius:24px;padding:24px;position:relative;box-shadow:0 1px 2px rgba(23,24,31,.04),0 12px 40px -24px rgba(107,92,231,.25);flex-shrink:0}
.dx{position:absolute;top:22px;right:22px;width:36px;height:36px;border-radius:50%;border:0;background:#EFEFF6;color:#17181F;font-size:20px;line-height:1;cursor:pointer}.dx:hover{background:#E6E5EE}
.dsec2{display:flex;flex-direction:column;gap:12px;flex-shrink:0}.dh{font-size:17px;font-weight:700;letter-spacing:-.01em;padding:0 2px}.dd{font-size:14px;color:#7A7C8A;line-height:1.6;padding:0 2px}.dd b{color:#17181F}
.dcard{background:#FFFFFF;border-radius:22px;padding:18px 16px;box-shadow:0 1px 2px rgba(23,24,31,.04)}
.dbars{display:flex;gap:8px;align-items:flex-end}.dbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.dbar b{font-size:13px;font-weight:700;margin-bottom:8px}.dbar i{display:block;width:100%;background:#6B5CE7;border-radius:6px 6px 3px 3px}
.dbar .gw{font-size:11px;color:#A6A8B4}.dbar .op,.dbar .mn{font-size:10px;font-weight:600;border-radius:999px;padding:3px 0;width:100%;text-align:center;white-space:nowrap;overflow:hidden}.dmin{background:#E8F1FC;color:#2F6CC9}
.dkv{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex-shrink:0}.dkv div{background:#FFFFFF;border-radius:18px;padding:16px 18px;box-shadow:0 1px 2px rgba(23,24,31,.04)}.dkv b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em}.dkv span{display:block;font-size:13px;color:#7A7C8A;margin-top:4px}
.dtab{width:100%;border-collapse:collapse;font-size:14px}.dtab th{font-size:11px;color:#A6A8B4;font-weight:500;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:10px 0;border-bottom:1px solid #F1F1F6}.dtab td{padding:12px 0;border-bottom:1px solid #F1F1F6}.dtab tr:last-child td{border:0}.dtab .g{color:#7A7C8A}.dtab td.xc{text-align:right;font-weight:700}.dtab th.xc{text-align:right}
.dnum{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:700;margin-right:6px}
.dmine{background:#F1EFFC;border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;flex-shrink:0}.dmine>b{font-size:15px}.dmine .dt{font-size:14px;color:#4A4C5A;line-height:1.6}
.drow{display:flex;gap:8px;flex-wrap:wrap}.drow select,.drow input[type=text]{border:0;outline:none;background:#FFFFFF;border-radius:14px;padding:11px 14px;font:inherit;font-size:14px;color:#17181F}.drow input[type=text]{flex:1;min-width:120px}
.dwb{border:0;background:#FFFFFF;border-radius:14px;padding:11px 16px;font:inherit;font-size:14px;font-weight:700;color:#17181F;cursor:pointer;white-space:nowrap}.dwb:hover{background:#FAFAFC}
.dbl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;border-top:1px solid #E3DEFF;font-size:13px;color:#7A7C8A}
.x{position:absolute;top:18px;right:18px;border:0;background:#F1F1F6;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;color:#7A7C8A}.x:hover{color:#17181F}
/* настройки */

<script>
const DESIGN = 2;
const D = /*__DATA__*/null;
/*__CORE__*/

/* ===================== Дизайн 2: общие кусочки ===================== */
const CLUB={MCI:'#6FB4E0',LIV:'#D0313F',ARS:'#DE3A36',CHE:'#2F5EA8',MUN:'#D03A3C',BHA:'#2F6CC9',NFO:'#CF3535',EVE:'#2F4FA6',TOT:'#2B3A68',NEW:'#3A3A3E',AVL:'#86325C',FUL:'#3A3A3A',BOU:'#C53B3E',BRE:'#D93238',WOL:'#DBA52B',CRY:'#355FAE',SUN:'#DB3A44',LEE:'#CDAB1A',HUL:'#E3942F',COV:'#4FA8DC',IPS:'#4A73B0',BUR:'#7A2F54',SOU:'#D71920',WHU:'#7A263A',LEI:'#1F4FA8'};
const clubC = t => CLUB[t] || '#9A9CB0';
const abN = n => String(n||'?').replace(/^[A-ZА-Я]\./,'').replace('Ø','O').slice(0,2).toUpperCase();
const AVF = s => s>=60?18:s>=48?13:s>=40?12:s>=36?11:s>=30?10:s>=26?9:8;
/* аватар: кружок цвета клуба с двумя буквами (как в макете); клик — карточка игрока */
function cav(id,s,op){ // фото игрока с эмблемой клуба; нет фото — футболка цвета клуба с буквами
  const h=av(id,s); return op?`<span style="display:inline-flex;flex:none;opacity:${op}">${h}</span>`:h; }
const DF = f => f<=2?1:f===3?2:f===4?3:4;            // сложность FPL 1–5 → 4 цвета макета
const DOT = {1:'#5CCB93',2:'#C9CAD6',3:'#F0B45C',4:'#E9777B'};
const fxo = f => f.opp+(f.h?'':' ·');
const fxPills = (p,n) => `<div class="fxr">${(p.fix||[]).slice(0,n||5).map(f=>`<span class="d${DF(f.fdr)}" title="GW${f.gw}">${fxo(f)}</span>`).join('')||'<span class="d0">—</span>'}</div>`;
const fxDots = p => `<div class="fdots">${(p.fix||[]).slice(0,5).map(f=>`<span title="GW${f.gw} ${fxo(f)}" style="background:${DOT[DF(f.fdr)]}"></span>`).join('')}</div>`;
const sgn = (v,d) => (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d==null?1:d);
const fmtN = n => (n>0?'+':n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('ru-RU');
const pad2 = x => String(x).padStart(2,'0');
const fmtDT = iso => { const d=new Date(iso); return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+', '+pad2(d.getHours())+':'+pad2(d.getMinutes()); };
const fmtT = iso => { const d=new Date(iso); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
const SP = '<span class="sp"></span>';
const genR = n => /[аa]$/i.test(n)?n.slice(0,-1)+'ы':/я$/.test(n)?n.slice(0,-1)+'и':/[бвгджзклмнпрстфхцчшщ]$/i.test(n)?n+'а':n;  // Рома→Ромы, Стас→Стаса
const POS1 = {GK:'Вратарь',DEF:'Защитник',MID:'Полузащитник',FWD:'Нападающий'};
const CHA = {wildcard:'WC',freehit:'FH',bboost:'BB','3xc':'TC'};
const CHN = {wildcard:'Wildcard',freehit:'Free Hit',bboost:'Bench Boost','3xc':'Triple Captain'};
const CHC = {WC:['#EDEAFF','#6B5CE7'],FH:['#FDEBD3','#9A5B12'],BB:['#D7F3E4','#1D7A4F'],TC:['#FBDCDD','#B13036']};
const CHS = {WC:'#C44FD6',FH:'#E8A23B',BB:'#2EB67D',TC:'#6B5CE7'};
const CHKEY = n => ({'wildcard':'WC','free hit':'FH','freehit':'FH','bench boost':'BB','bboost':'BB','triple captain':'TC','3xc':'TC'})[String(n).toLowerCase()]||'WC';
const CSHORT={wildcard:'Пересборка состава',bboost:'Скамейка тоже играет',freehit:'Один идеальный тур','3xc':'Капитан ×3'};
const CTIP={wildcard:'Прирост xP за 6 туров после розыгрыша сверх обычного плана, без хитов.',bboost:'Сумма xP четырёх игроков скамейки; важно, чтобы они реально играли. Штраф за матчи «свои против своих».',freehit:'Идеальный состав на один тур; лучше всего работает на пустых или двойных турах.','3xc':'Капитан приносит тройные очки.'};
const tagCls = {'мой':'t-me','скаут':'t-sc','в ЧС':'t-bl'};
const ownerName = id => { const p=P[id]; if(p&&p.taken_by&&p.taken_by!=='чёрный список') return p.taken_by; return null; };
/* метка игрока: соперник — его имя серым; «в ЧС» — только ручной чёрный список */
function tagA(p){ if(!p) return ''; if(p.mine) return '<span class="tag t-me">мой</span>'; const o=ownerName(p.id); if(o) return `<span class="tag t-gr">${esc(o)}</span>`;
  if(isBlocked(p.id)) return '<span class="tag t-bl">в ЧС</span>'; if(wlGet(p.id)) return '<span class="tag t-sc">скаут</span>'; if(p.wide) return '<span class="tag t-mu" title="вне топ-списков: в рекомендациях не участвует">вне списков</span>'; return ''; }
function tagB(id){ const p=P[id]; if(!p) return ''; if(p.mine) return '<span class="tag t-me">мой</span>'; const o=ownerName(id); if(o) return `<span class="tag t-gr">${esc(o)}</span>`; if(isBlocked(id)) return '<span class="tag t-bl">в ЧС</span>'; if(wlGet(id)) return '<span class="tag t-sc">скаут</span>'; return ''; }
function availPill(id){ const p=P[id]; if(!p) return ''; if(p.mine) return '<span class="pl t-me">мой</span>'; const o=ownerName(id);
  if(o) return `<span class="pl t-sc">занят: ${esc(o)}</span>`; if(isBlocked(id)) return '<span class="pl t-bl">в ЧС</span>'; return '<span class="pl t-ok">свободен</span>'; }
const flagC = p => !p||p.status==='a'?'':(p.status==='d'?'#E8A23B':'#E5484D');
const flag = p => flagC(p)?`<span title="${esc(p.news||'')}" style="width:7px;height:7px;border-radius:50%;background:${flagC(p)};flex-shrink:0;display:inline-block"></span>`:'';
/* строка «игрок»: аватар + имя (+метка) + подпись */
function whoRow(id,s,sub,o){ o=o||{}; const p=P[id];
  return `<div class="who" style="gap:${o.gap||10}px">${cav(id,s,o.op)}<div><div class="row6"><span class="nm${o.mut?' mut':''}" style="${o.fs?'font-size:'+o.fs+'px':''}">${pnk(id)}</span>${o.tag||''}</div><div class="cl">${sub!=null?sub:(p?p.tname:pt(id))}</div></div></div>`; }
function btCard(){
  const B=D.backtest; if(!B||!B.ok) return `<div class="card pd" style="gap:8px"><div class="lbl">Точность прогноза</div><div class="empty">${esc((B&&B.note)||'нет данных')}</div></div>`;
  const rs=B.retro_summary||{}, fs=B.forward_summary||{};
  const row=(lab,v,tip)=>v?`<div style="display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr));gap:8px;font-size:13px;padding:7px 0;border-top:1px solid #F4F4F8"><span title="${tip||''}">${lab}</span><b>${v.mae.toFixed(2)}</b><b>${(v.pearson||0).toFixed(2)}</b><b>${(v.spearman||0).toFixed(2)}</b><b>${(v.top10_actual||0).toFixed(2)}</b></div>`:'';
  const head='<div style="display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr));gap:8px;font-size:11px;color:#A6A8B4;padding-bottom:4px"><span></span><span title="Средняя ошибка в очках, меньше — лучше">MAE</span><span title="Корреляция прогноза с фактом">Корр.</span><span title="Корреляция порядка игроков">Порядок</span><span title="Сколько очков в среднем набрали топ-10 по позиции, выбранные моделью">Топ-10</span></div>';
  const n=Object.keys(B.retro||{}).length, nf=Object.keys(B.forward||{}).length;
  return `<div class="card pd" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span class="lbl">Точность прогноза очков</span><span style="font-size:12px;color:#A6A8B4">ретро: ${n} тур.</span></div>${head}
    ${row('Среднее очков',rs.naive)}${row('Среднее × минуты',rs.mins)}${row('<b>Наша xP</b>',rs.xp)}
    ${nf?`<div style="font-size:12px;color:#7A7C8A;margin-top:8px">Журнал (прогнозы до дедлайна), туров: ${nf}</div>${row('Наша xP',fs.xp)}${row('ep_next FPL',fs.ep)}`:`<div style="font-size:12px;color:#7A7C8A;margin-top:8px">Журнал честных прогнозов копится (записано туров: ${B.logged_gws||0}). Сравнение с ep_next FPL появится после первого сыгранного тура.</div>`}
    <div style="font-size:12px;color:#A6A8B4;margin-top:6px">${esc(B.note||'')}</div></div>`;
}
function sec(t,s,body,sCls){ return `<div class="sec"><div class="sh"><div class="t">${t}</div>${s?`<div class="s"${sCls?` style="${sCls}"`:''}>${s}</div>`:''}</div>${body}</div>`; }
const CL0 = () => { const CL=D.claude_lineup; return CL&&!CL.errors.length&&!CL.stale?CL:null; };
/* аватар менеджера: эмблема любимого клуба из FPL (как в карточке команды), не загрузилась — буква */
function mgrAv(k,name,sz,bg,fg){
  const ft=((D.league||{})[k]||{}).fav_team, ini=esc((name||'?')[0]);
  const mono=`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${bg};color:${fg};display:grid;place-items:center;font-weight:600;font-size:${Math.round(sz*.34)}px;flex-shrink:0">${ini}</div>`;
  if(!ft) return mono;
  return `<div title="${esc(name)} · болеет за ${esc(ft.name)}" style="width:${sz}px;height:${sz}px;border-radius:50%;background:${bg==='#17181F'?'#F1F1F6':bg};display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 0 0 1.5px ${bg==='#17181F'?'#17181F':'transparent'}"><img alt="" src="https://resources.premierleague.com/premierleague/badges/100/t${ft.code}.png" style="width:${Math.round(sz*.66)}px;height:${Math.round(sz*.66)}px;object-fit:contain" onerror="this.parentNode.outerHTML=this.parentNode.dataset.m" ></div>`.replace('<div title', `<div data-m="${esc(mono)}" title`);
}
const leagueKeyByEntry = e => Object.keys(D.league||{}).find(k=>(D.league[k]||{}).entry===e);
const nameOfKey = k => (D.league_names||{})[k] || k;
function myPlace(){ const lt=D.league_table||[], me=lt.find(r=>r.entry===D.me.entry); return {lt, me, n:lt.length, lead:lt[0]}; }

/* ===================== v1.19: шансы по данным FPL (CS %, DC %, голы/ассисты, стандарты, xG команд, ротация, владение, live) ===================== */
const TABS2 = (()=>{ const t=TABS.slice(), i=t.findIndex(x=>x[0]==='players'); t.splice(i+1,0,['fix','Матчи']); return t; })();
const TCODE = {}; D.players.forEach(p=>{ if(p.tcode) TCODE[p.team]=p.tcode; });

/* ---------- «Трансферы»: пары для ротации ---------- */
let ROT={pos:'GK',h:5,cap:50,mine:1};
function rotSec(){
  const g0=D.meta.gw_next, H=ROT.h, cap=ROT.cap*1;
  const sum=(p)=>(p.xpg||[]).slice(0,H).reduce((a,b)=>a+b,0);
  let cand=D.players.filter(p=>p.pos===ROT.pos&&(p.xpg||[]).length>=H&&(p.mine?ROT.mine:(!isBlocked(p.id)&&(cap>=999||p.price<=cap)&&p.mfrac>=0.45&&!['i','s','u'].includes(p.status))));
  cand=cand.sort((a,b)=>sum(b)-sum(a)).slice(0,32);
  const pairs=[];
  for(let i=0;i<cand.length;i++) for(let j=i+1;j<cand.length;j++){ const a=cand[i],b=cand[j]; if(!ROT.mine&&(a.mine||b.mine)) continue;
    const xa=a.xpg.slice(0,H), xb=b.xpg.slice(0,H); const tot=xa.reduce((s,v,k)=>s+Math.max(v,xb[k]),0), best=Math.max(sum(a),sum(b));
    pairs.push({a,b,xa,xb,tot,gain:tot-best,pct:best?((tot-best)/best*100):0,cost:a.price+b.price}); }
  pairs.sort((x,y)=>y.tot-x.tot);
  const myGK=ROT.pos==='GK'?D.me.squad.map(x=>P[x.id]).filter(p=>p&&p.pos==='GK'):[];
  let mine=null; if(myGK.length===2){ const [a,b]=myGK, xa=(a.xpg||[]).slice(0,H), xb=(b.xpg||[]).slice(0,H), tot=xa.reduce((s,v,k)=>s+Math.max(v,xb[k]||0),0), best=Math.max(sum(a),sum(b)); mine={a,b,xa,xb,tot,gain:tot-best,pct:best?(tot-best)/best*100:0,cost:a.price+b.price,me:1}; }
  // ротация имеет смысл, только если играют оба (выгода > 0); один игрок — не больше чем в двух парах
  const cnt={}, top=[];
  for(const x of pairs){ if(top.length>=6) break; if(x.gain<0.1) continue; if(mine&&((x.a===mine.a&&x.b===mine.b)||(x.a===mine.b&&x.b===mine.a))) continue;

function vSquad(){
  const lu=D.sugg.lineup, cl=D.claude_lineup, useCl=SQV==='claude'&&cl;
  const xi=useCl?cl.xi:lu.xi, bench=useCl?cl.bench:lu.bench, cap=useCl?cl.captain:lu.captain, vice=useCl?cl.vice:lu.vice, notes=(cl&&cl.notes)||{};
  const fm=(useCl?cl.formation:lu.formation)||'', xiP=xi.map(i=>P[i]).filter(Boolean), sum=a=>a.reduce((s,p)=>s+p.xp1,0).toFixed(1);
  const by={GK:[],DEF:[],MID:[],FWD:[]}; xiP.forEach(p=>by[p.pos].push(p));
  const lines=[by.FWD,by.MID,by.DEF,by.GK].filter(l=>l.length), m=Math.max(...lines.map(l=>l.length));
  const cw=`min(150px, calc((100% - ${(m-1)*12}px) / ${m}))`;
  const card=p=>{const b=p.id===cap?['C','#6B5CE7']:p.id===vice?['V','#A6A8B4']:null, nt=notes[p.id];
    return `<div class="pcard" data-id="${p.id}" style="width:${cw}">${b?`<div class="pbadge" style="background:${b[1]}">${b[0]}</div>`:''}
      ${cav(p.id,40)}<div style="min-width:0;width:100%"><div style="font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:center;gap:4px">${flag(p)}${esc(p.name)}${nt?'<span class="ndot" title="есть заметка Claude"></span>':''}</div><div style="font-size:11px;color:#A6A8B4;margin-top:1px;white-space:nowrap">${p.tname} · xP1 <b style="color:#6B5CE7;font-weight:600">${p.xp1.toFixed(1)}</b></div></div>${fxDots(p)}</div>`;};
  const benchP=bench.map(i=>P[i]).filter(Boolean);
  const benchHtml=benchP.map((p,i)=>{const sq=D.me.squad.find(x=>x.id===p.id)||{};return `<div class="bench" data-id="${p.id}"><div style="position:absolute;top:12px;right:14px;font-size:11px;color:#A6A8B4;font-weight:600">${i===0&&p.pos==='GK'?'GK':String(i)}</div>
    <div style="display:flex;align-items:center;gap:9px">${cav(p.id,38)}<div style="min-width:0"><div style="font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div><div style="font-size:12px;color:#A6A8B4;margin-top:1px">${p.tname} · £${money(p.price)} · xP1 <b style="color:#6B5CE7;font-weight:600">${p.xp1.toFixed(1)}</b></div></div></div>${fxPills(p)}</div>`}).join('');
  // панель справа
  const short=s=>{const m=/^(новости проверены[^:]*)/i.exec(s||'');return m?m[1]:'';};
  let pTitle,pSub,pIcon,pNote,warn='';
  if(SQV==='claude'){
    if(!cl){ pTitle='Вердикт Claude'; pSub='рекомендации пока нет'; pIcon='claude'; pNote='Claude ещё не дал рекомендацию. Попроси: «дай состав на тур» — он заполнит claude_picks.json, и состав появится здесь. Пока на поле — расчёт программы по xP.'; }
    else { pTitle='Вердикт Claude'; pSub=short(cl.status)||('обновлено '+(cl.updated||'')); pIcon='claude'; pNote=cl.summary||'';
      if(cl.stale) warn=`Рекомендация составлена на GW${cl.gw}, а ближайший тур — GW${D.meta.gw_next}. Попроси Claude обновить её после новостей.`;
      if(cl.errors.length) warn+=(warn?' ':'')+'Ошибки в claude_picks.json: '+cl.errors.join('; '); }
  } else { pTitle='Новости по составу'; pSub='из прессы и API FPL'+(cl&&cl.updated?' · '+cl.updated.split('-').reverse().slice(0,2).join('.'):''); pIcon='news';
    pNote=`Чисто математический расчёт по xP без учёта новостей: сумма ${lu.xp_total}, капитан по xP1. Ниже — свежие факты по игрокам из старта, итоговое решение смотри во вкладке Claude.`; }
  const tags=(cl&&cl.tags)||[];
  // чем рекомендация Claude отличается от расчёта программы (как в Дизайне 1)
  let diffHtml='';
  if(cl&&!cl.errors.length){ const pX=new Set(lu.xi), cX=new Set(cl.xi), dIn=cl.xi.filter(i=>!pX.has(i)), dOut=lu.xi.filter(i=>!cX.has(i)), dCap=cl.captain!==lu.captain, dVice=cl.vice!==lu.vice;
    const nm=a=>a.map(i=>`<b style="font-weight:600">${pnk(i)}</b>`).join(', ');
    const rows=[dIn.length?`<div>в старт: ${nm(dIn)} · на скамейку: ${nm(dOut)}</div>`:'', dCap?`<div>капитан: ${pnk(cl.captain)} вместо ${pnk(lu.captain)}</div>`:'', dVice?`<div>вице: ${pnk(cl.vice)} вместо ${pnk(lu.vice)}</div>`:''].filter(Boolean);
    diffHtml=`<div style="border-radius:14px;background:#F6F4FF;padding:10px 12px;font-size:13px;line-height:1.6;color:#4A4C5A"><div style="font-size:11px;font-weight:600;color:#6B5CE7;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Отличие от расчёта программы</div>${rows.length?rows.join(''):'<div>совпадает с расчётом по xP</div>'}</div>`; }
  const noteIds=[...xi,...bench].filter(i=>notes[i]&&P[i]&&(SQV==='claude'||xi.includes(i)));
  const panel=`<div style="background:#FFFFFF;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 2px rgba(23,24,31,.04),0 24px 60px -40px rgba(107,92,231,.25);position:sticky;top:88px;flex:1 1 300px;min-width:0">
    <div style="display:flex;align-items:center;gap:10px">${ic(pIcon,32)}<div><div style="font-size:15px;font-weight:600;letter-spacing:-.01em">${pTitle}</div><div style="font-size:12px;color:#A6A8B4">${esc(pSub)}</div></div></div>
    ${warn?`<div class="t-sc" style="border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5">${esc(warn)}</div>`:''}
    ${SQV==='claude'&&cl&&cl.status&&cl.status.length>short(cl.status).length+2?`<div style="font-size:12px;line-height:1.5;color:#7A7C8A">${esc(short(cl.status)?cl.status.slice(short(cl.status).length).replace(/^[:\s]+/,''):cl.status)}</div>`:''}
    <div style="font-size:14px;line-height:1.6;color:#4A4C5A;text-wrap:pretty">${esc(pNote)}</div>
    ${diffHtml}
    ${tags.length?`<div style="display:flex;flex-wrap:wrap;gap:6px">${tags.map(t=>`<span style="font-size:12px;color:#6B5CE7;background:#F6F4FF;border-radius:999px;padding:4px 10px">${esc(t)}</span>`).join('')}</div>`:''}
    ${noteIds.length?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));column-gap:24px;border-top:1px solid #EFEFF4">${noteIds.map(i=>{const p=P[i];return `<div style="display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #F4F4F8">${cav(i,34)}<div style="min-width:0"><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:14px;font-weight:600">${pnk(i)}</span><span style="font-size:11px;color:#A6A8B4">${p.tname} · xP1 ${p.xp1.toFixed(1)}</span></div><div style="font-size:13px;line-height:1.55;color:#4A4C5A;margin-top:3px;text-wrap:pretty">${esc(notes[i])}</div></div></div>`}).join('')}</div>`:''}
  </div>`;
  return `<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap">
    <div class="hd"><div class="ht">Состав <span>GW${D.meta.gw_next}</span></div>
      <div class="facts"><span>Схема <b style="word-spacing:-.2em">${esc(fm.split('-').join(' / '))}</b></span>${SP}<span>xP1 <b style="color:#6B5CE7">${sum(xiP)}</b></span>${SP}
      <span style="display:inline-flex;align-items:center;gap:6px"><span class="cap" style="background:#6B5CE7">C</span><b>${cap?pnk(cap):'–'}</b></span><span style="display:inline-flex;align-items:center;gap:6px"><span class="cap" style="background:#C9CAD6">V</span><b>${vice?pnk(vice):'–'}</b></span>${SP}<span>дедлайн через <b class="cds"></b></span></div></div>
    <div class="seg"><button class="${SQV==='claude'?'on':''}" onclick="setSQV('claude')">${ic('claude',20)}Рекомендация Claude</button><button class="${SQV==='calc'?'on':''}" onclick="setSQV('calc')">Расчёт программы (xP)</button></div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:20px;min-width:0;flex:1 1 680px">
      <div class="card gl" style="padding:14px"><div class="pitch">${lines.map(l=>`<div class="pline">${l.map(card).join('')}</div>`).join('')}</div></div>
      <div class="card" style="padding:20px 24px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="lbl">Скамейка · порядок автозамен</span><span class="lbl">суммарно <b style="color:#17181F;font-weight:600">${sum(benchP)} xP</b></span></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">${benchHtml}</div></div>
    </div>
    ${panel}
  </div>`;
}

/* ===================== Трансферы и план ===================== */
function vMoves(){
  const s=D.sugg, pl=D.plan||{};
  const head=`<div class="hd"><div class="ht">Трансферы и план <span>GW${D.meta.gw_next}</span></div>
    <div class="facts"><span>Банк <b>£${money(s.bank)}</b></span>${SP}<span>свободных трансферов <b style="${s.ft>0?'':'color:#E5484D'}">${s.ft}</b></span>${SP}<span>цены продажи по правилу FPL</span>${SP}<span>исключены игроки ${esc(RIV.map(genR).join(', ')||'соперников')} и чёрного списка</span></div></div>`;
  // слабые звенья
  const weak=s.weak.map((id,k)=>{const p=P[id]; if(!p) return ''; const subs=(D.insurance[id]||[]).filter(i=>!isBlocked(i)&&P[i]).slice(0,3);
    return `<div class="card r24 hov" style="padding:18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:box-shadow .2s" data-id="${id}">

      <div style="display:flex;gap:16px;align-items:baseline"><div><div style="font-size:11px;color:#A6A8B4">xP5</div><div style="font-size:24px;font-weight:600;letter-spacing:-.035em;color:#E5484D">${p.xp5.toFixed(1)}</div></div><div><div style="font-size:11px;color:#A6A8B4">форма</div><div style="font-size:16px;font-weight:600;letter-spacing:-.02em">${p.form.toFixed(1)}</div></div><div><div style="font-size:11px;color:#A6A8B4">цена</div><div style="font-size:16px;font-weight:600;letter-spacing:-.02em">£${money(p.price)}</div></div></div>
      ${fxPills(p)}
      <div style="display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid #F1F1F6"><div style="font-size:11px;color:#A6A8B4">замены</div>${subs.map(i=>`<div style="display:flex;align-items:center;gap:8px">${cav(i,22)}<span style="font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pnk(i)}</span><span style="font-size:12px;font-weight:600;color:${P[i].xp5-p.xp5>=0?'#2EB67D':'#E5484D'}">${sgn(P[i].xp5-p.xp5)}</span></div>`).join('')||'<div style="font-size:12px;color:#A6A8B4">нет вариантов в бюджет</div>'}</div></div>`}).join('');
  // одиночные
  const single=diverse(s.single.filter(m=>!isBlocked(m.inn)),2).slice(0,8), smx=Math.max(1,...single.map(m=>m.gain));
  const hs=new Set(single.map(m=>m.hit||0)), hTxt=hs.size===1?([...hs][0]?`все с хитом −${[...hs][0]}`:'без хита'):'хит — у каждого свой';
  const SC='32px minmax(170px,1fr) minmax(190px,1fr) minmax(180px,1fr) 80px 90px';
  const singleSec=sec('Лучшие одиночные ходы',`топ-8 по приросту xP за 5 туров · ${hTxt}`,`<div class="card tb"><div style="min-width:720px">
    <div class="g th" style="grid-template-columns:${SC}"><div>#</div><div>Продать</div><div>Купить</div><div>Прирост xP5</div><div style="text-align:right">Δ цена</div><div style="text-align:right">Банк после</div></div>
    ${single.map((m,i)=>`<div class="g hv" style="grid-template-columns:${SC};padding:10px 8px">
      <div style="font-size:14px;font-weight:600;color:#A6A8B4">${i+1}</div>
      ${whoRow(m.out,32,pt(m.out),{op:.4,mut:1})}
      <div style="display:flex;align-items:center;gap:10px;min-width:0"><span style="color:#C9CAD6">→</span>${whoRow(m.inn,32,pt(m.inn))}</div>
      <div style="display:flex;align-items:center;gap:12px"><span style="font-size:15px;font-weight:600;letter-spacing:-.02em;color:#6B5CE7;min-width:48px">+${m.gain.toFixed(1)}</span><div class="b4" style="flex:1"><i style="width:${Math.round(m.gain/smx*100)}%"></i></div></div>
      <div style="text-align:right;font-size:14px;color:#7A7C8A">${sgn(m.delta/10)}</div>
      <div style="text-align:right;font-size:14px;font-weight:600">£${money(m.bank_after)}</div></div>`).join('')||'<div class="empty">нет подходящих ходов</div>'}</div></div>`);
  // двойные
  const dbl=s.double.filter(p=>!isBlocked(p.a.inn)&&!isBlocked(p.b.inn)).slice(0,4);
  const dh=new Set(dbl.map(d=>d.hit||0)), dTxt=dh.size===1?([...dh][0]?'хит −'+[...dh][0]:'без хита'):'хит у каждого свой';
  const pairRow=(a)=>`<div style="display:flex;align-items:center;gap:8px">${cav(a.out,28,.4)}<span style="font-size:13px;color:#7A7C8A">${pnk(a.out)}</span><span style="color:#C9CAD6">→</span>${cav(a.inn,28)}<span style="font-size:14px;font-weight:600">${pnk(a.inn)}</span></div>`;
  const dblSec=dbl.length?sec('Двойные ходы',`топ-4 · ${dTxt}`,`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">${dbl.map((d,i)=>`<div class="card r24 hov" style="padding:20px 22px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .2s">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:13px;color:#A6A8B4;font-weight:500">№${i+1}</span><span style="font-size:22px;font-weight:600;letter-spacing:-.03em;color:#6B5CE7">+${d.gain.toFixed(1)} <span style="font-size:12px;color:#A6A8B4;font-weight:500;letter-spacing:0">xP5</span></span></div>
      <div style="display:flex;flex-direction:column;gap:8px">${pairRow(d.a)}${pairRow(d.b)}</div>
      <div style="font-size:12px;color:#A6A8B4;padding-top:12px;border-top:1px solid #F1F1F6">${d.hit?'хит −'+d.hit:'без хита'} · банк после <b style="color:#17181F;font-weight:600">£${money(d.bank_after)}</b></div></div>`).join('')}</div>`):'';
  // план
  let planSec='';
  if(pl.steps&&!pl.error){
    const PC='70px minmax(240px,1.4fr) 70px 70px 90px minmax(120px,.8fr)';
    planSec=`<div class="sec" style="gap:24px"><div style="display:flex;flex-direction:column;gap:10px;padding:0 4px"><div style="font-weight:600;font-size:20px;letter-spacing:-.025em">План на ${pl.horizon} туров</div><div class="desc">Планировщик подбирает ходы по турам с учётом банка, свободных трансферов, хитов и лимита клуба. Это расчёт по xP: травмы и новости проверяет Claude, оценки чипов приблизительные.</div></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:32px;padding:0 4px">
        <div class="stat"><div class="k">Без трансферов</div><div class="v">${pl.baseline}</div><div class="s">xP за ${pl.horizon} туров</div></div>
        <div class="stat"><div class="k">По плану</div><div class="v">${pl.best_total}</div><div class="s">с учётом хитов</div></div>
        <div class="stat"><div class="k">Прирост</div><div class="v" style="color:#2EB67D">+${pl.gain}</div><div class="s">банк в конце £${money(pl.bank_end)}</div></div></div>
      <div class="card gl tb"><div style="min-width:640px"><div class="g th" style="grid-template-columns:${PC}"><div>Тур</div><div>Трансферы</div><div style="text-align:right">FT до</div><div style="text-align:right">Хит</div><div style="text-align:right">xP тура</div><div>Капитан</div></div>
      ${pl.steps.map(st=>{const nx=st.gw===D.meta.gw_next;return `<div class="g" style="grid-template-columns:${PC};padding:10px 8px;background:${nx?'#F6F4FF':'transparent'}">
        <div style="font-size:15px;font-weight:600;letter-spacing:-.02em;color:${nx?'#6B5CE7':'#17181F'}">GW${st.gw}</div>
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0">${st.moves.length?st.moves.map(([o,c])=>`<div style="display:flex;align-items:center;gap:8px;min-width:0">${cav(o,28,.4)}<span style="font-size:13px;color:#7A7C8A;white-space:nowrap">${pnk(o)}</span><span style="color:#C9CAD6">→</span>${cav(c,28)}<span style="font-size:14px;font-weight:600;white-space:nowrap">${pnk(c)}</span></div>`).join(''):'<span style="font-size:13px;color:#A6A8B4">без ходов</span>'}</div>
        <div style="text-align:right;font-size:14px;color:#7A7C8A">${st.ft_before}</div>
        <div style="text-align:right;font-size:13px;font-weight:600;color:${st.hit?'#E5484D':'#C9CAD6'}">${st.hit?'−'+st.hit:'–'}</div>
        <div style="text-align:right;font-size:14px;font-weight:600;letter-spacing:-.02em">${st.value.toFixed(1)}</div>
        <div style="display:flex;align-items:center;gap:7px;font-size:13px"><span class="cap">C</span>${st.captain?pnk(st.captain):'–'}</div></div>`}).join('')}</div></div></div>`;
  } else planSec=`<div class="card pd"><div class="empty">${esc(pl.error||'План не построен')}</div></div>`;
  // альтернативы
  const mainKey=new Set((pl.steps||[]).flatMap(st=>st.moves.map(([o,c])=>st.gw+':'+o+':'+c)));
  const alts=(pl.alts||[]).map((a,i)=>{const diff=a.total!=null?(a.total-pl.best_total):0, eq=diff>=-0.05;
    return `<div class="card r24" style="padding:22px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div style="font-size:15px;font-weight:600;letter-spacing:-.01em">Вариант ${String.fromCharCode(66+i)}</div><div style="font-size:12px;color:#A6A8B4;margin-top:2px">+${a.gain} xP к игре без трансферов</div></div><span class="pl ${eq?'t-ok':'t-gr'}" style="padding:4px 10px">${eq?'на уровне основного':sgn(diff)+' к основному'}</span></div>
      <div style="display:flex;flex-direction:column">${(a.first||[]).map(m=>{const same=mainKey.has(m.gw+':'+m.out+':'+m.in);return `<div style="display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #F4F4F8"><span style="font-size:13px;font-weight:600;color:#7A7C8A">GW${m.gw}</span>
        <div style="display:flex;align-items:center;gap:8px;min-width:0">${cav(m.out,26,.4)}<span style="color:#C9CAD6;font-size:12px">→</span>${cav(m.in,26)}<div style="min-width:0"><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pnk(m.in)}</div><div style="font-size:11px;color:#A6A8B4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">вместо ${pnk(m.out)}</div></div></div>
        ${same?'<span></span>':'<span style="font-size:10px;font-weight:600;color:#9A5B12;background:#FDEBD3;border-radius:999px;padding:3px 8px">иначе</span>'}</div>`}).join('')||'<div class="empty">без ходов</div>'}</div></div>`}).join('');
  const altSec=alts?sec('Альтернативные планы','близкий результат · метка «иначе» — ход отличается от основного',`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">${alts}</div>`):'';
  // чипы

  const mgrSec=`<div class="sec"><div class="sh"><div class="t">Мини-лига</div>${conf}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start">${mgr}</div></div>`;
  // вероятные ходы друзей
  const prRow=(x,col,mx)=>`<div style="display:grid;grid-template-columns:1fr 70px 36px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #F4F4F8;font-size:13px"><span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b style="font-weight:600">${pnk(x.id)}</b> <span style="color:#A6A8B4">${pt(x.id)}</span></span><div class="b4"><i style="background:${col};width:${Math.min(100,x.prob*100*1.6)}%;border-radius:0"></i></div><span style="text-align:right;font-weight:600">${Math.round(x.prob*100)}%</span></div>`;
  const fr=Object.entries(th.friends||{}).map(([k,f])=>`<div class="card" style="padding:24px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="font-size:16px;font-weight:600;letter-spacing:-.01em">${esc(f.name)}</span><span class="pl ${f.verified?'t-ok':'t-gr'}" title="${f.verified?'':'API не показывает ходы на ближайший тур до дедлайна — пришли Claude скрин или список состава'}">${f.verified?'состав подтверждён':'состав на прошлый дедлайн'}</span><span style="margin-left:auto;font-size:13px;color:#7A7C8A">банк <b style="color:#17181F;font-weight:600">£${money(f.bank)}</b> · FT <b style="color:#17181F;font-weight:600">${f.ft}</b> · ожидаемо ходов <b style="color:#17181F;font-weight:600">${f.exp_moves}</b></span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px"><div><div style="font-size:12px;color:#A6A8B4;margin-bottom:6px">вероятно продаст</div>${f.sells.map(x=>prRow(x,'#E8A23B')).join('')||'<div style="font-size:13px;color:#A6A8B4">—</div>'}</div><div><div style="font-size:12px;color:#A6A8B4;margin-bottom:6px">вероятно купит</div>${f.buys.map(x=>prRow(x,'#E5484D')).join('')||'<div style="font-size:13px;color:#A6A8B4">—</div>'}</div></div></div>`).join('');
  const frSec=fr?sec('Что, вероятно, сделают друзья','по составам, травмам, форме и истории трансферов',`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start">${fr}</div>`):'';
  // гонка
  let raceSec='';
  if(rc.players){
    const rp=Object.entries(rc.players).sort((a,b)=>b[1].p_win-a[1].p_win); let oi=0; const RCOL=['#17181F','#A6A8B4','#C9CAD6','#DDDCE6','#E6E5EE'];
    const rv=rp.map(([k,v])=>{const me_=k==='me', col=me_?'#6B5CE7':RCOL[Math.min(oi++,4)];return {k,v,me_,col,bg:me_?'#EDEAFF':col==='#17181F'?'#17181F':'#F1F1F6',fg:me_?'#6B5CE7':col==='#17181F'?'#FFFFFF':'#7A7C8A',pct:Math.round(v.p_win*100)};});
    const meLead=rc.gap===0||rc.leader==='me';
    raceSec=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start">

        <div style="display:flex;flex-direction:column">${rv.map(r=>`<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #EFEFF4">${mgrAv(r.k,r.v.name,40,r.bg,r.fg)}<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600">${esc(r.v.name)} <span style="font-size:12px;color:#A6A8B4;font-weight:500">${r.me_?'ты':''}</span></div><div style="font-size:12px;color:#7A7C8A;margin-top:2px">${r.v.total} очк. · ср. ${r.v.mean} · финал ≈ ${r.v.exp_final}</div></div><div style="font-size:26px;font-weight:600;letter-spacing:-.04em;color:${r.col}">${r.pct}%</div></div>`).join('')}</div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card pd" style="gap:16px"><div class="lbl">Твой шанс на победу: влияние риска</div>
          <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;font-size:12px;color:#A6A8B4;padding-bottom:6px"><div>средний прирост</div><div style="text-align:right">обычно</div><div style="text-align:right">риск ×1.25</div><div style="text-align:right">риск ×1.5</div></div>
          ${(rc.scenarios||[]).map(r=>`<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #F4F4F8;font-size:14px"><div style="color:#4A4C5A">+${r.boost} очк./тур</div>${r.p.map((v,j)=>`<div style="text-align:right;font-weight:600;${j?'color:#7A7C8A':''}">${Math.round(v*100)}%</div>`).join('')}</div>`).join('')}

        <div class="card pd" style="gap:12px"><div class="lbl">Фишки у соперников</div>
          ${Object.entries(rc.chips_left||{}).map(([k,v])=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #F4F4F8"><span style="font-size:14px;font-weight:600;flex:1">${esc(k==='me'?ME_NAME:(OWN[k]||k))}</span><div style="display:flex;gap:6px">${v.map(nm=>{const a=CHKEY(nm);return `<span title="${esc(nm)}">${chipIc(nm,28)}</span>`}).join('')||'<span style="font-size:12px;color:#A6A8B4">нет</span>'}</div></div>`).join('')}</div>
      </div></div>`;
  }
  return head+liveSec()+thr+mgrSec+eoSec()+frSec+raceSec+vExtra();
}

/* ===================== Рынок ===================== */
function nextPriceChange(){ // смена цен FPL ≈ 01:30 по Лондону → местное время
  try{ const now=new Date(), lon=new Date(now.toLocaleString('en-US',{timeZone:'Europe/London'})), off=now-lon;
    const t=new Date(lon); t.setHours(1,30,0,0); if(t<=lon) t.setDate(t.getDate()+1); const loc=new Date(t.getTime()+off);
    const today=loc.toDateString()===now.toDateString(); return (today?'сегодня ':'завтра ')+pad2(loc.getHours())+':'+pad2(loc.getMinutes()); }catch(e){ return 'ночью'; }
}
function vMarket(){
  const mk=D.market||{}, lk=D.luck||{}, thr=mk.thr||1;
  const mRow=(x,col)=>{const p=P[x.id];return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #F4F4F8">${cav(x.id,36)}<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${pnk(x.id)}</div><div style="font-size:12px;color:#A6A8B4">${pt(x.id)} · £${money(x.price)} → £${money(x.price+(x.net>0?1:-1))}</div></div><div style="text-align:right"><div style="font-size:15px;font-weight:600;letter-spacing:-.02em;color:${col}">${fmtN(x.net)}</div><div style="font-size:11px;color:#A6A8B4">${Math.round(Math.abs(x.net)/thr*100)}% порога</div></div></div>`;};
  const up=mk.targets_up||[], dn=mk.my_risk||[], gain=(mk.my_gain||[]).filter(x=>P[x.id]).slice(0,2);
  const stable=D.me.squad.length-dn.length;
  const lst=(arr,col,rtl)=>arr.filter(x=>P[x.id]).map(x=>`<div class="g hv" style="grid-template-columns:minmax(0,1fr) 90px 80px;padding:8px" data-id="${x.id}">${whoRow(x.id,32,`${pt(x.id)} · £${money(x.price)}`,{tag:tagB(x.id)})}<div class="b4"${rtl?' style="direction:rtl"':''}><i style="background:${col};width:${Math.min(100,Math.abs(x.net)/(thr*3.5)*100)}%"></i></div><div style="text-align:right;font-size:13px;font-weight:600;color:${col};white-space:nowrap">${fmtN(x.net)}</div></div>`).join('')||'<div class="empty">нет</div>';
  const luck=(arr,col)=>arr.filter(x=>P[x.id]).map(x=>{const p=P[x.id];return `<div class="g hv" style="grid-template-columns:minmax(0,1fr) 56px 100px;gap:10px;padding:8px" data-id="${x.id}"><div class="who">${cav(x.id,32)}<div style="min-width:0"><div class="nm">${pnk(x.id)} <span style="font-size:11px;color:#A6A8B4;font-weight:500">${p.tname} · ${p.pos}</span></div><div style="font-size:12px;color:#7A7C8A;margin-top:1px">${x.gi} GI vs xGI ${x.xgi}${p.pos==='DEF'||p.pos==='GK'?' · CS '+x.cs:''}</div></div></div><div style="text-align:right;font-size:14px;font-weight:600;color:${col}">${sgn(x.delta,2)}</div><div style="text-align:right">${availPill(x.id)}</div></div>`}).join('')||'<div class="empty">нет</div>';
  return `<div class="hd"><div class="ht">Рынок <span>цены и удача</span></div><div class="facts"><span>порог изменения <b>≈ ${Math.round(thr).toLocaleString('ru-RU')}</b> чистых трансферов</span>${SP}<span>смена цен <b>${nextPriceChange()}</b></span>${SP}<span>ориентир, не гарантия${mk.calib_events?` · калибровка по ${mk.calib_events} событиям`:''}</span></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
    <div class="card gl" style="padding:24px 28px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><span class="lbl">Мои цели дорожают</span>${up.length?'<span style="font-size:12px;font-weight:600;color:#E8A23B">брать сегодня</span>':''}</div>${up.filter(x=>P[x.id]).map(x=>mRow(x,'#2EB67D')).join('')||'<div style="font-size:13px;color:#A6A8B4;padding:10px 0">рост цен у целей не ожидается</div>'}</div>
    <div class="card" style="padding:24px 28px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><span class="lbl">Мои игроки под угрозой падения</span><span style="font-size:12px;color:#A6A8B4">учитывай при продаже</span></div>${dn.filter(x=>P[x.id]).map(x=>mRow(x,'#E5484D')).join('')}
      <div style="font-size:13px;color:#7A7C8A;line-height:1.6;padding-top:12px;text-wrap:pretty">${dn.length?`Остальные ${stable} игроков стабильны.`:'Все игроки состава стабильны.'}${gain.length?` ${gain.map(x=>esc(P[x.id].name)).join(' и ')} ${gain.length>1?'держат':'держит'} положительное давление, но до порога далеко.`:''}</div></div></div>
  ${sec('Движение цен','полоса — доля порога · метка — мой / скаут / чей игрок',`<div class="grid3"><div class="card tb"><div class="ch"><b>Растут в цене</b><span>чистые трансферы за день</span></div>${lst(mk.rising||[],'#2EB67D')}</div><div class="card tb"><div class="ch"><b>Падают в цене</b><span>чистые трансферы за день</span></div>${lst(mk.falling||[],'#E5484D',1)}</div></div>`)}
  ${ownSec()}
  <div class="sec"><div style="display:flex;flex-direction:column;gap:8px;padding:0 4px"><div style="font-weight:600;font-size:20px;letter-spacing:-.025em">Удача: очки против ожиданий</div><div class="desc">Разница фактических голов + ассистов (у защитников и вратарей — чистых матчей) и ожидаемых (xGI, xGC). Недоудачливые чаще подтягиваются, перегретые — просядут.</div></div>
    <div class="grid3"><div class="card tb"><div class="ch"><b style="color:#1D7A4F">Недоудачливые</b><span>ожидаемый рост</span></div>${luck(lk.under||[],'#2EB67D')}</div><div class="card tb"><div class="ch"><b style="color:#B13036">Перегретые</b><span>ожидаемый спад</span></div>${luck(lk.over||[],'#E5484D')}</div></div></div>`;
}

/* ===================== Топ-50 ===================== */
function vTop(){

    <div style="display:flex;align-items:center;gap:16px;padding-right:44px">${cav(id,64).replace('data-id','data-x')}<div style="min-width:0"><div style="font-size:13px;color:#7A7C8A">${p.tname} · ${POSP[p.pos]}</div><div style="font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:2px" title="${esc(p.full.trim())}">${esc(p.name)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${p.mine?'<span class="pl t-me" style="font-size:12px;padding:4px 10px">мой</span>':availPill(id).replace('class="pl','style="font-size:12px;padding:4px 10px" class="pl')}${pricePill}${spPills(p)}${p.status!=='a'&&p.news?`<span class="pl t-bl" style="font-size:12px;padding:4px 10px">${esc(p.news)}</span>`:''}</div></div></div>
    <div style="font-size:14px;color:#4A4C5A;margin-top:18px">${priceLine(p)}</div></div>
  <div class="dsec2"><div class="dh">Очки в прошлых турах</div>
    ${ser.length?`<div class="dd">За ${ser.length} тур${ser.length===1?'':ser.length<5?'а':'ов'}: <b>${tot}</b> очк. · в среднем <b>${avg.toFixed(1)}</b> за игру. Плашка под столбиком — сложность соперника, нижняя — минуты.</div><div class="dcard">${barsHtml(ser)}</div>`:'<div class="dd">История загружается при запуске без --no-history.</div>'}</div>
  <div class="dkv">${kv.map(([v,k])=>`<div><b>${v}</b><span>${k}</span></div>`).join('')}</div>
  ${seasonsHtml(p)}
  <div class="dsec2"><div class="dh">Следующие матчи</div><div class="dcard" style="padding:8px 20px">${next?`<table class="dtab"><thead><tr><th>Тур</th><th>Соперник</th><th>Сложность</th><th class="xc">xP</th></tr></thead><tbody>${next}</tbody></table>`:'<div class="dd" style="padding:12px 0">нет данных календаря</div>'}</div></div>
  ${chancesHtml(p)}
  ${drScout(p)}
  ${ins?`<div class="dsec2"><div class="dh">Если выбьется — замена в бюджет</div><div class="dcard" style="padding:6px 20px">${ins}</div></div>`:''}`;
  $('#drawer').classList.add('open'); $('#drawer').scrollTop=0;
}

function closeDrawer(){ $('#drawer').classList.remove('open'); }

function bind(){
  const q=$('#q'); if(q){q.oninput=()=>{state.q=q.value; const pos=q.selectionStart; render(); const q2=$('#q'); q2.focus(); q2.setSelectionRange(pos,pos);}}
  document.querySelectorAll('#posseg button').forEach(b=>b.onclick=()=>{state.pos=b.dataset.p; render()});
  document.querySelectorAll('.srt').forEach(h=>h.onclick=()=>{const k=h.dataset.s; if(state.sort===k) state.dir*=-1; else {state.sort=k; state.dir=-1} render()});
}
render();
</script>
</body>
</html>
